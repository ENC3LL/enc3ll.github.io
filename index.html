<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>neural.cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
/* ── Reset ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080808;color:#e0e0e0;font-family:'DM Mono',monospace;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
a{color:inherit;text-decoration:none}

/* ── Tokens ── */
:root{
  --bg:#080808;
  --s1:#111;
  --s2:#181818;
  --s3:#202020;
  --b1:#1e1e1e;
  --b2:#2a2a2a;
  --b3:#363636;
  --t1:#e0e0e0;
  --t2:#888;
  --t3:#444;
  --t4:#282828;
  --green:#4ade80;
  --red:#f87171;
  --yellow:#fbbf24;
  --blue:#60a5fa;
  --purple:#c084fc;
  --orange:#fb923c;
}

/* ── Screens ── */
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden}
.screen.active{display:flex}

/* ── Home ── */
#homeScreen{background:var(--bg)}
.home-header{
  padding:24px 20px 0;
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
}
.logo{font-family:'Instrument Serif',serif;font-size:22px;letter-spacing:-0.02em}
.logo em{font-style:italic;color:var(--t2)}
.xp-badge{
  display:flex;align-items:center;gap:6px;
  font-size:11px;color:var(--t2);
  border:1px solid var(--b2);border-radius:3px;padding:5px 10px;
}
.xp-num{color:var(--yellow);font-weight:500}

.home-scroll{flex:1;overflow-y:auto;padding:24px 20px 40px}
.home-scroll::-webkit-scrollbar{display:none}

.home-intro{margin-bottom:28px}
.home-intro h2{
  font-family:'Instrument Serif',serif;font-size:28px;font-style:italic;
  line-height:1.2;margin-bottom:8px;
}
.home-intro p{font-size:12px;color:var(--t2);line-height:1.7}

/* Section cards */
.section-list{display:flex;flex-direction:column;gap:10px}
.section-card{
  border:1px solid var(--b1);border-radius:8px;
  background:var(--s1);
  overflow:hidden;
  transition:border-color 0.15s,background 0.15s;
  position:relative;
}
.section-card:active{background:var(--s2)}

.section-glow{
  position:absolute;top:0;left:0;width:3px;height:100%;
}

.section-inner{padding:16px 16px 16px 20px;display:flex;align-items:center;gap:14px}
.section-icon{
  font-size:20px;width:40px;height:40px;
  display:flex;align-items:center;justify-content:center;
  border-radius:6px;background:var(--s2);flex-shrink:0;
}
.section-info{flex:1;min-width:0}
.section-title{font-size:14px;font-weight:500;color:var(--t1);margin-bottom:3px}
.section-desc{font-size:11px;color:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.section-meta{
  display:flex;align-items:center;gap:8px;margin-top:8px;
}
.section-count{font-size:10px;color:var(--t3);letter-spacing:0.04em}
.section-progress-bar{
  height:2px;background:var(--b1);border-radius:1px;flex:1;overflow:hidden
}
.section-progress-fill{height:100%;border-radius:1px;transition:width 0.4s ease}
.section-pct{font-size:10px;color:var(--t3);min-width:24px;text-align:right}

.section-arrow{color:var(--t3);font-size:12px;flex-shrink:0}

/* ── Lesson picker ── */
#lessonScreen{background:var(--bg)}
.lesson-header{
  padding:16px 20px;
  display:flex;align-items:center;gap:12px;
  border-bottom:1px solid var(--b1);flex-shrink:0;
}
.back-btn{
  width:32px;height:32px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--b2);border-radius:4px;font-size:14px;color:var(--t2);
  transition:all 0.1s;flex-shrink:0;
}
.back-btn:active{background:var(--s2)}
.lesson-header-info{flex:1}
.lesson-header-title{font-size:15px;color:var(--t1)}
.lesson-header-sub{font-size:11px;color:var(--t3);margin-top:2px}

.lesson-scroll{flex:1;overflow-y:auto;padding:20px}
.lesson-scroll::-webkit-scrollbar{display:none}

.mode-toggle{
  display:flex;border:1px solid var(--b1);border-radius:6px;overflow:hidden;
  margin-bottom:20px;
}
.mode-toggle button{
  flex:1;padding:10px;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--t3);transition:all 0.15s;
}
.mode-toggle button.active{background:var(--t1);color:var(--bg)}
.mode-toggle button:not(.active):active{background:var(--s2);color:var(--t1)}

.lesson-cards-grid{display:flex;flex-direction:column;gap:8px}
.lesson-card-item{
  border:1px solid var(--b1);border-radius:6px;background:var(--s1);
  padding:14px 16px;display:flex;align-items:center;gap:12px;
  transition:all 0.1s;
}
.lesson-card-item:active{background:var(--s2)}
.lci-num{
  width:28px;height:28px;border-radius:4px;border:1px solid var(--b2);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;color:var(--t3);flex-shrink:0;
}
.lci-num.done{background:var(--b1);color:var(--t2)}
.lci-info{flex:1}
.lci-q{font-size:12px;color:var(--t2);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px}
.lci-lvl{
  font-size:9px;letter-spacing:0.08em;text-transform:uppercase;
  margin-top:3px;
}
.lci-status{font-size:14px;flex-shrink:0}

.start-session-btn{
  width:100%;margin-top:20px;padding:14px;
  border:1px solid var(--b2);border-radius:6px;
  font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:var(--t1);
  transition:all 0.15s;
}
.start-session-btn:active{background:var(--s2)}
.start-session-btn.colored{border-color:currentColor}

/* ── Session ── */
#sessionScreen{background:var(--bg)}

.session-top{
  padding:14px 20px 0;flex-shrink:0;
  display:flex;align-items:center;gap:10px;
}
.session-close{
  width:30px;height:30px;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--b2);border-radius:4px;font-size:16px;color:var(--t2);
  flex-shrink:0;
}
.session-progress-wrap{flex:1;height:6px;background:var(--b1);border-radius:3px;overflow:hidden}
.session-progress-bar{height:100%;border-radius:3px;transition:width 0.35s ease;background:var(--t2)}
.session-hearts{display:flex;gap:3px;flex-shrink:0}
.heart{font-size:14px;transition:all 0.2s}
.heart.lost{opacity:0.2;filter:grayscale(1)}

.session-content{
  flex:1;overflow-y:auto;padding:20px 20px 24px;
  display:flex;flex-direction:column;gap:16px;
}
.session-content::-webkit-scrollbar{display:none}

.session-label{
  font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--t3);
}

/* Flip card */
.flip-scene{perspective:900px;min-height:220px;cursor:pointer}
.flip-card{
  width:100%;height:100%;min-height:220px;
  position:relative;transform-style:preserve-3d;
  transition:transform 0.42s cubic-bezier(.4,0,.2,1);
}
.flip-card.flipped{transform:rotateY(180deg)}
.flip-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border:1px solid var(--b1);border-radius:8px;
  padding:22px 20px;display:flex;flex-direction:column;background:var(--s1);
  min-height:220px;
}
.flip-back{transform:rotateY(180deg);background:var(--s2)}
.flip-q{
  font-family:'Instrument Serif',serif;font-size:22px;line-height:1.35;
  flex:1;display:flex;align-items:center;color:var(--t1);
}
.flip-a{font-size:12px;line-height:1.7;color:var(--t2);flex:1}
.flip-tap{font-size:10px;color:var(--t4);text-align:center;margin-top:10px;letter-spacing:0.06em}

.flip-actions{display:flex;gap:8px}
.fa-btn{
  flex:1;padding:13px 8px;border:1px solid var(--b2);border-radius:6px;
  font-size:11px;letter-spacing:0.06em;color:var(--t2);
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:all 0.12s;
}
.fa-btn:active{background:var(--s2)}
.fa-btn.bad:active,.fa-btn.bad.highlight{border-color:var(--red);color:var(--red);background:#f871710a}
.fa-btn.good:active,.fa-btn.good.highlight{border-color:var(--green);color:var(--green);background:#4ade800a}

/* Quiz card */
.quiz-wrap{border:1px solid var(--b1);border-radius:8px;background:var(--s1);overflow:hidden}
.quiz-question{
  padding:22px 20px 16px;border-bottom:1px solid var(--b1);
}
.quiz-q-text{
  font-family:'Instrument Serif',serif;font-size:20px;line-height:1.4;color:var(--t1);
}
.quiz-opts{padding:10px;display:flex;flex-direction:column;gap:6px}
.opt{
  padding:12px 14px;border:1px solid var(--b2);border-radius:5px;
  font-size:12px;color:var(--t2);text-align:left;
  display:flex;align-items:flex-start;gap:10px;line-height:1.45;
  transition:all 0.12s;
}
.opt:not(:disabled):active{background:var(--s2);color:var(--t1);border-color:var(--b3)}
.opt-key{font-size:10px;color:var(--t3);min-width:14px;margin-top:1px;letter-spacing:0.04em;flex-shrink:0}
.opt.correct{border-color:var(--green)!important;color:var(--green)!important;background:#4ade800a!important}
.opt.wrong{border-color:var(--red)!important;color:var(--red)!important;background:#f871710a!important}
.opt:disabled{cursor:default}

.quiz-feedback{
  margin:0 10px 10px;padding:12px 14px;border-radius:5px;
  font-size:11px;line-height:1.65;display:none;
  animation:fadeUp 0.2s ease;
}
.quiz-feedback.show{display:block}
.quiz-feedback.ok{background:#4ade8010;border:1px solid #4ade8025;color:#4ade80}
.quiz-feedback.err{background:#f8717110;border:1px solid #f8717125;color:#f87171}

.quiz-next{
  width:calc(100% - 20px);margin:0 10px 10px;
  padding:12px;border:1px solid var(--b2);border-radius:5px;
  font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--t2);
  display:none;transition:all 0.12s;
}
.quiz-next.show{display:block}
.quiz-next:active{background:var(--s2);color:var(--t1)}

/* Session stats */
.session-stats{display:flex;gap:8px;flex-shrink:0}
.ss{
  flex:1;padding:12px 8px;border:1px solid var(--b1);border-radius:6px;
  text-align:center;background:var(--s1);
}
.ss-n{font-family:'Instrument Serif',serif;font-size:24px;color:var(--t1)}
.ss-l{font-size:9px;color:var(--t3);letter-spacing:0.08em;text-transform:uppercase;margin-top:2px}
.ss-n.g{color:var(--green)}.ss-n.r{color:var(--red)}

/* Done screen */
.done-wrap{
  flex:1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:32px 20px;gap:10px;
}
.done-emoji{font-size:48px;margin-bottom:4px}
.done-title{font-family:'Instrument Serif',serif;font-size:34px;font-style:italic;color:var(--t1)}
.done-sub{font-size:12px;color:var(--t2);line-height:1.7;max-width:260px}
.done-xp{
  margin-top:8px;padding:10px 24px;
  border:1px solid var(--b2);border-radius:4px;
  font-size:11px;color:var(--yellow);letter-spacing:0.06em;
}
.done-btns{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
.done-btn{
  padding:13px;border:1px solid var(--b2);border-radius:6px;
  font-size:11px;letter-spacing:0.08em;text-transform:uppercase;
  color:var(--t2);transition:all 0.12s;
}
.done-btn:active{background:var(--s2);color:var(--t1)}
.done-btn.primary{border-color:var(--t2);color:var(--t1)}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.08)}100%{transform:scale(1)}}
.card-in{animation:fadeUp 0.22s ease}
.pop{animation:pop 0.25s ease}

/* ── Level pill ── */
.lvl-pill{display:inline-block;font-size:9px;letter-spacing:0.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid;margin-bottom:12px}
.lvl-beginner{color:#4ade80;border-color:#4ade8030}
.lvl-intermediate{color:#60a5fa;border-color:#60a5fa30}
.lvl-advanced{color:#c084fc;border-color:#c084fc30}
</style>
</head>
<body>

<!-- ══ HOME ══ -->
<div class="screen active" id="homeScreen">
  <div class="home-header">
    <div class="logo">neural<em>.</em>cards</div>
    <div class="xp-badge">⚡ <span class="xp-num" id="xpNum">0</span> XP</div>
  </div>
  <div class="home-scroll">
    <div class="home-intro">
      <h2>Учи AI/ML<br>по 5 минут в день</h2>
      <p>Флипкарты и квизы · от базы до продвинутого<br>Прогресс сохраняется локально</p>
    </div>
    <div class="section-list" id="sectionList">
      <!-- injected -->
    </div>
  </div>
</div>

<!-- ══ LESSON ══ -->
<div class="screen" id="lessonScreen">
  <div class="lesson-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="lesson-header-info">
      <div class="lesson-header-title" id="lessonTitle">—</div>
      <div class="lesson-header-sub" id="lessonSub">—</div>
    </div>
  </div>
  <div class="lesson-scroll">
    <div class="mode-toggle" id="modeToggle">
      <button class="active" id="modeFlipBtn" onclick="setSessionMode('flip')">Карточки</button>
      <button id="modeQuizBtn" onclick="setSessionMode('quiz')">Квиз</button>
    </div>
    <div class="lesson-cards-grid" id="lessonCardsList"></div>
    <button class="start-session-btn" id="startBtn" onclick="startSession()">
      Начать сессию →
    </button>
  </div>
</div>

<!-- ══ SESSION ══ -->
<div class="screen" id="sessionScreen">
  <div class="session-top">
    <button class="session-close" onclick="closeSession()">✕</button>
    <div class="session-progress-wrap">
      <div class="session-progress-bar" id="sessionBar" style="width:0%"></div>
    </div>
    <div class="session-hearts" id="sessionHearts"></div>
  </div>
  <div class="session-content" id="sessionContent"></div>
</div>

<script src="app.js"></script>
</body>
</html>
