<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>neural.cards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080808;color:#e0e0e0;font-family:'DM Mono',monospace;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
:root{
  --bg:#080808;--s1:#111;--s2:#181818;--s3:#202020;
  --b1:#1e1e1e;--b2:#2a2a2a;--b3:#363636;
  --t1:#e0e0e0;--t2:#888;--t3:#444;--t4:#252525;
  --green:#4ade80;--red:#f87171;--yellow:#fbbf24;--blue:#60a5fa;--purple:#c084fc;
}
.screen{display:none;flex-direction:column;height:100vh;overflow:hidden}
.screen.active{display:flex}

/* ══ HOME ══ */
#homeScreen{background:var(--bg)}
.home-header{padding:22px 20px 0;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:'Instrument Serif',serif;font-size:20px;letter-spacing:-0.02em}
.logo em{font-style:italic;color:var(--t2)}
.xp-pill{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--t2);border:1px solid var(--b2);border-radius:3px;padding:5px 10px}
.xp-num{color:var(--yellow);font-weight:500}
.home-scroll{flex:1;overflow-y:auto;padding:20px 20px 60px}
.home-scroll::-webkit-scrollbar{display:none}
.home-hero{margin-bottom:20px}
.home-hero h2{font-family:'Instrument Serif',serif;font-size:24px;font-style:italic;line-height:1.2;margin-bottom:5px}
.home-hero p{font-size:11px;color:var(--t3);line-height:1.65}

/* streak */
.streak-bar{display:flex;gap:10px;margin-bottom:22px;padding:12px 14px;background:var(--s1);border:1px solid var(--b1);border-radius:8px;align-items:flex-start}
.sb-icon{font-size:18px;margin-top:1px}
.sb-text{flex:1;font-size:11px;color:var(--t2);line-height:1.5}
.sb-text strong{color:var(--yellow);display:block;font-size:12px;margin-bottom:1px}
.sb-days{display:flex;gap:3px;margin-top:8px}
.sb-day{width:20px;height:20px;border-radius:3px;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:8px;color:var(--t3)}
.sb-day.done{background:#4ade8018;border-color:#4ade8040;color:var(--green)}

/* chapters */
.chapter-list{display:flex;flex-direction:column;gap:10px}
.chapter{border:1px solid var(--b1);border-radius:10px;background:var(--s1);overflow:hidden}
.chapter-head{padding:13px 13px 12px 16px;display:flex;align-items:center;gap:12px;cursor:pointer;position:relative}
.ch-stripe{position:absolute;left:0;top:0;width:3px;height:100%}
.ch-icon{font-size:16px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;background:var(--s2);flex-shrink:0}
.ch-info{flex:1;min-width:0}
.ch-title{font-size:13px;font-weight:500;margin-bottom:2px}
.ch-desc{font-size:10px;color:var(--t3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch-prog-row{display:flex;align-items:center;gap:6px;margin-top:5px}
.ch-prog-bar{flex:1;height:2px;background:var(--b1);border-radius:2px;overflow:hidden}
.ch-prog-fill{height:100%;border-radius:2px;transition:width .5s ease}
.ch-pct{font-size:9px;color:var(--t3);min-width:24px;text-align:right}
.ch-chevron{color:var(--t3);font-size:10px;transition:transform .2s;flex-shrink:0;margin-left:2px}
.chapter.open .ch-chevron{transform:rotate(90deg)}
.lessons-wrap{max-height:0;overflow:hidden;transition:max-height .35s ease}
.chapter.open .lessons-wrap{max-height:1000px}
.lessons-inner{padding:0 10px 10px;display:flex;flex-direction:column;gap:5px}

/* lesson rows */
.lesson-row{padding:10px 11px;border:1px solid var(--b1);border-radius:6px;background:var(--s2);display:flex;align-items:center;gap:10px;cursor:pointer;transition:background .1s}
.lesson-row:active{background:var(--s3)}
.lesson-row.locked{opacity:.3;pointer-events:none}
.lr-icon{width:26px;height:26px;border-radius:4px;border:1px solid var(--b2);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--t3);flex-shrink:0}
.lr-icon.done-ic{background:var(--b2);color:var(--t2)}
.lr-icon.rev-ic{border-style:dashed}
.lr-info{flex:1;min-width:0}
.lr-title{font-size:12px;color:var(--t1)}
.lr-sub{font-size:10px;color:var(--t3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lr-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.due-dot{width:7px;height:7px;border-radius:50%;background:var(--yellow)}
.lesson-row.review-row{border-style:dashed;border-color:var(--b2)}
.lesson-row.chapter-final{background:var(--s1)}

/* ══ THEORY ══ */
#theoryScreen{background:var(--bg)}
.th-header{padding:12px 16px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--b1);flex-shrink:0}
.back-btn{width:30px;height:30px;display:flex;align-items:center;justify-content:center;border:1px solid var(--b2);border-radius:4px;font-size:13px;color:var(--t2);flex-shrink:0}
.th-info{flex:1;min-width:0}
.th-ch-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:2px}
.th-lname{font-size:13px;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th-dots{display:flex;gap:4px;flex-shrink:0}
.th-dot{width:6px;height:6px;border-radius:50%;background:var(--b2);transition:background .2s}
.th-dot.cur{background:var(--t2)}
.th-dot.past{background:var(--green)}

.th-scroll{flex:1;overflow-y:auto;padding:18px 16px 0}
.th-scroll::-webkit-scrollbar{display:none}

/* theory slide */
.th-slide{display:none;flex-direction:column;animation:fadeUp .22s ease}
.th-slide.active{display:flex}
.th-tag{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.th-concept{font-family:'Instrument Serif',serif;font-size:26px;line-height:1.2;color:var(--t1);margin-bottom:14px}
.th-def{background:var(--s1);border:1px solid var(--b1);border-radius:8px;padding:15px 16px;margin-bottom:10px;font-size:12px;line-height:1.8;color:var(--t2)}
.th-def strong{color:var(--t1);font-weight:500}
.th-formula{background:var(--s3);border:1px solid var(--b2);border-radius:4px;padding:10px 14px;margin-bottom:10px;overflow-x:auto}
.th-formula-text{font-size:12px;color:var(--blue);white-space:nowrap}
.th-example{background:var(--s2);border-left:3px solid var(--yellow);border-radius:0 4px 4px 0;padding:11px 13px;margin-bottom:10px}
.th-ex-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.th-ex-text{font-size:12px;line-height:1.7;color:var(--t1)}
.th-ex-text em{font-style:normal;background:#fbbf2418;color:var(--yellow);padding:0 3px;border-radius:2px}
.th-analogy{background:var(--s1);border:1px solid var(--b1);border-radius:6px;padding:12px 13px;margin-bottom:10px;display:flex;gap:10px}
.th-analogy-ico{font-size:17px;flex-shrink:0;margin-top:1px}
.th-analogy-text{font-size:11px;line-height:1.7;color:var(--t2);font-style:italic}

/* recall prompt */
.th-recall{background:var(--s2);border:1px dashed var(--b3);border-radius:6px;padding:12px 14px;margin:14px 0 12px}
.th-recall-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:5px}
.th-recall-text{font-size:11px;color:var(--t2);line-height:1.65}
.th-recall-text strong{color:var(--t1)}

.th-nav{display:flex;gap:8px;padding-bottom:28px}
.th-btn{flex:1;padding:13px;border:1px solid var(--b2);border-radius:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);transition:all .12s}
.th-btn:active{background:var(--s2);color:var(--t1)}
.th-btn.primary{border-color:var(--t1);color:var(--t1)}
.th-btn.go{border-color:var(--green);color:var(--green)}

/* ══ SESSION ══ */
#sessionScreen{background:var(--bg)}
.sess-top{padding:12px 16px 0;flex-shrink:0;display:flex;align-items:center;gap:10px}
.sess-close{width:28px;height:28px;display:flex;align-items:center;justify-content:center;border:1px solid var(--b2);border-radius:4px;font-size:14px;color:var(--t2);flex-shrink:0}
.sess-prog-wrap{flex:1;height:6px;background:var(--b1);border-radius:3px;overflow:hidden}
.sess-prog-bar{height:100%;border-radius:3px;transition:width .35s ease}
.sess-hearts{display:flex;gap:3px;flex-shrink:0}
.heart{font-size:13px;transition:all .2s}
.heart.lost{opacity:.18;filter:grayscale(1)}

.sess-content{flex:1;overflow-y:auto;padding:14px 16px 28px;display:flex;flex-direction:column;gap:12px}
.sess-content::-webkit-scrollbar{display:none}

/* review band */
.rev-band{background:var(--s2);border:1px solid var(--b2);border-radius:6px;padding:9px 13px;display:flex;align-items:flex-start;gap:10px}
.rev-band-ico{font-size:15px;margin-top:1px}
.rev-band-text{font-size:11px;color:var(--t2);line-height:1.5}
.rev-band-text strong{color:var(--t1);display:block;margin-bottom:1px}

/* mini theory hint */
.mini-th{border:1px solid var(--b1);border-radius:8px;background:var(--s1);overflow:hidden}
.mini-th-head{padding:10px 13px;display:flex;align-items:center;gap:8px;cursor:pointer}
.mini-th-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);flex:1}
.mini-th-toggle{font-size:10px;color:var(--t3)}
.mini-th-body{padding:10px 13px 12px;display:none;border-top:1px solid var(--b1)}
.mini-th-body.open{display:block}
.mini-th-concept{font-family:'Instrument Serif',serif;font-size:16px;color:var(--t1);margin-bottom:5px}
.mini-th-def{font-size:11px;line-height:1.7;color:var(--t2)}

/* quiz */
.quiz-wrap{border:1px solid var(--b1);border-radius:8px;background:var(--s1);overflow:hidden}
.quiz-q-area{padding:15px 14px 12px;border-bottom:1px solid var(--b1)}
.quiz-q-lbl{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:7px;display:flex;align-items:center;gap:8px}
.quiz-q-text{font-family:'Instrument Serif',serif;font-size:19px;line-height:1.4;color:var(--t1)}
.quiz-opts{padding:7px;display:flex;flex-direction:column;gap:5px}
.opt{padding:10px 12px;border:1px solid var(--b2);border-radius:5px;font-size:12px;color:var(--t2);text-align:left;display:flex;align-items:flex-start;gap:10px;line-height:1.45;transition:all .1s}
.opt:not(:disabled):active{background:var(--s2);color:var(--t1);border-color:var(--b3)}
.opt-key{font-size:9px;color:var(--t3);min-width:14px;margin-top:2px;flex-shrink:0}
.opt.correct{border-color:var(--green)!important;color:var(--green)!important;background:#4ade800a!important}
.opt.wrong{border-color:var(--red)!important;color:var(--red)!important;background:#f871710a!important}
.opt:disabled{cursor:default}
.quiz-fb{margin:0 7px 7px;padding:10px 12px;border-radius:5px;font-size:11px;line-height:1.65;display:none;animation:fadeUp .18s ease}
.quiz-fb.show{display:block}
.quiz-fb.ok{background:#4ade8010;border:1px solid #4ade8025;color:#4ade80}
.quiz-fb.err{background:#f8717110;border:1px solid #f8717125;color:#f87171}
.quiz-nxt{width:calc(100% - 14px);margin:0 7px 7px;padding:11px;border:1px solid var(--b2);border-radius:5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);display:none;transition:all .12s}
.quiz-nxt.show{display:block}
.quiz-nxt:active{background:var(--s2);color:var(--t1)}

/* stats */
.stats-row{display:flex;gap:6px;flex-shrink:0}
.stat-box{flex:1;padding:10px 6px;border:1px solid var(--b1);border-radius:6px;text-align:center;background:var(--s1)}
.stat-n{font-family:'Instrument Serif',serif;font-size:22px;color:var(--t1)}
.stat-l{font-size:9px;color:var(--t3);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.stat-n.g{color:var(--green)}.stat-n.r{color:var(--red)}.stat-n.y{color:var(--yellow)}

/* done */
.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 20px;gap:10px}
.done-emoji{font-size:48px;margin-bottom:4px}
.done-title{font-family:'Instrument Serif',serif;font-size:30px;font-style:italic;color:var(--t1)}
.done-sub{font-size:11px;color:var(--t2);line-height:1.75;max-width:260px}
.done-sr{background:var(--s1);border:1px solid var(--b1);border-radius:6px;padding:12px 14px;margin-top:4px;width:100%;text-align:left}
.done-sr-title{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:8px}
.done-sr-row{display:flex;justify-content:space-between;font-size:11px;color:var(--t2);padding:3px 0;border-bottom:1px solid var(--b1)}
.done-sr-row:last-child{border:none}
.done-sr-row span:last-child{color:var(--t1)}
.done-sr-note{font-size:10px;color:var(--t3);line-height:1.6;margin-top:8px}
.done-xp{margin-top:2px;padding:8px 20px;border:1px solid var(--b2);border-radius:4px;font-size:11px;color:var(--yellow);letter-spacing:.06em}
.done-btns{display:flex;flex-direction:column;gap:7px;width:100%;margin-top:6px}
.done-btn{padding:12px;border:1px solid var(--b2);border-radius:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--t2);transition:all .12s}
.done-btn:active{background:var(--s2);color:var(--t1)}
.done-btn.primary{border-color:var(--t1);color:var(--t1)}

/* level pills */
.lvl{display:inline-block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:2px;border:1px solid}
.lvl-beginner{color:#4ade80;border-color:#4ade8030}
.lvl-intermediate{color:#60a5fa;border-color:#60a5fa30}
.lvl-advanced{color:#c084fc;border-color:#c084fc30}

@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="homeScreen">
  <div class="home-header">
    <div class="logo">neural<em>.</em>cards</div>
    <div class="xp-pill">⚡ <span class="xp-num" id="xpNum">0</span> XP</div>
  </div>
  <div class="home-scroll">
    <div class="home-hero">
      <h2>Учи AI/ML<br>по 5 минут в день</h2>
      <p>Теория → Активное воспроизведение → Интервальные повторения</p>
    </div>
    <div class="streak-bar">
      <div class="sb-icon">🔥</div>
      <div class="sb-text">
        <strong id="streakLabel">Начни сегодня</strong>
        <span id="streakSub">Заходи каждый день — мозг запоминает через повторения</span>
        <div class="sb-days" id="streakDays"></div>
      </div>
    </div>
    <div class="chapter-list" id="chapterList"></div>
  </div>
</div>

<!-- THEORY -->
<div class="screen" id="theoryScreen">
  <div class="th-header">
    <button class="back-btn" onclick="goHome()">←</button>
    <div class="th-info">
      <div class="th-ch-lbl" id="thChLbl">—</div>
      <div class="th-lname" id="thLname">—</div>
    </div>
    <div class="th-dots" id="thDots"></div>
  </div>
  <div class="th-scroll" id="thScroll"></div>
</div>

<!-- SESSION -->
<div class="screen" id="sessionScreen">
  <div class="sess-top">
    <button class="sess-close" onclick="closeSession()">✕</button>
    <div class="sess-prog-wrap">
      <div class="sess-prog-bar" id="sessBar" style="width:0%"></div>
    </div>
    <div class="sess-hearts" id="sessHearts"></div>
  </div>
  <div class="sess-content" id="sessContent"></div>
</div>

<script src="app.js"></script>
</body>
</html>
