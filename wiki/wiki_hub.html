<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Knowledge Base — Wiki Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#171717;
  --bg-alt:#1c1c1c;
  --surface:#212121;
  --surface-2:#262626;
  --border:#3a3a3a;
  --border-soft:#2b2b2b;
  --text:#eeeeee;
  --text-dim:#a3a3a3;
  --text-faint:#6b6b6b;
  --violet:#7c4dff;
  --magenta:#e0356f;
  --amber:#ff3d68;
  --cyan:#2cc4d9;
  --green:#3ecf8e;
  --red:#e0355c;
  --heat: linear-gradient(90deg,#5b1030 0%,#a01340 32%,#e0355c 62%,#ff3d68 88%);
  --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  --sans: 'IBM Plex Sans', -apple-system, system-ui, sans-serif;
  --display: 'Space Grotesk', var(--sans);
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 85% -10%, rgba(255,61,104,0.06), transparent 60%),
    radial-gradient(900px 500px at 10% 0%, rgba(255,61,104,0.04), transparent 55%),
    var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15.5px;
  line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
::selection{background:rgba(255,61,104,0.30);}
a{color:var(--amber); text-decoration:none;}
a:hover{text-decoration:underline;}
h1,h2,h3,h4{font-family:var(--display); font-weight:600; letter-spacing:-0.01em; color:#fff; margin:0 0 .5em;}
code, .mono{font-family:var(--mono);}
p{margin:0 0 1em;}
.wrap{display:flex; max-width:1400px; margin:0 auto; min-height: 100vh;}

.toc{
  position:sticky; top:0; align-self:flex-start;
  width:262px; flex-shrink:0; height:100vh; overflow-y:auto;
  padding:28px 18px 40px 26px; border-right:1px solid var(--border-soft);
  scrollbar-width:thin; scrollbar-color:var(--border) transparent;
}
.toc::-webkit-scrollbar{width:6px;}
.toc::-webkit-scrollbar-thumb{background:var(--border); border-radius:3px;}
.toc-brand{display:flex; align-items:center; gap:8px; margin-bottom:22px;}
.toc-brand .dot{width:9px;height:9px;border-radius:2px; background:var(--heat);}
.toc-brand span{font-family:var(--mono); font-size:11.5px; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase;}

main{flex:1; min-width:0; padding:0 0 120px;}
.container{max-width:900px; margin:0 auto; padding:0 48px;}

.hero{padding:64px 48px 40px; border-bottom:1px solid var(--border-soft); position:relative; overflow:hidden;}
.hero::before{content:"";position:absolute; inset:0; background:
  repeating-linear-gradient(90deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 64px);
  pointer-events:none;}
.eyebrow{font-family:var(--mono); font-size:11.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--amber); display:flex; align-items:center; gap:10px; margin-bottom:18px;}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--amber);}
.hero h1{font-size:clamp(30px,4vw,44px); max-width:820px; line-height:1.08; background:linear-gradient(180deg,#fff, #c9cfe0); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom: 0;}

section.topic{padding:40px 0; border-bottom:1px solid var(--border-soft);}
section.topic:last-of-type{border-bottom:none;}
.topic-head{display:flex; align-items:flex-start; justify-content:space-between; gap:20px; flex-wrap:wrap; margin-bottom:26px;}
.topic-head h2{font-size:25px; display:flex; align-items:baseline; gap:12px; margin:0;}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:20px 0;}
@media(max-width:700px){.grid2{grid-template-columns:1fr;}}

/* Стили карточек Wiki */
.rec-card{background:linear-gradient(180deg, var(--surface), var(--bg-alt)); border:1px solid var(--border-soft); border-radius:12px; padding:22px 24px; margin:0; display:block; text-decoration:none; transition:all 0.2s ease;}
.rec-card:hover{transform:translateY(-4px); border-color:var(--amber); background:linear-gradient(180deg, var(--surface-2), var(--surface)); box-shadow:0 8px 24px rgba(0,0,0,0.2);}
.rec-card h4{font-size:16px; display:flex; align-items:center; gap:8px; margin:0 0 10px; transition:color 0.2s ease;}
.rec-card:hover h4{color:var(--amber);}
.rec-card p{color:var(--text-dim); font-size:13.8px; margin:0; line-height:1.5;}

.usedin{display:flex; flex-wrap:wrap; gap:7px; margin:16px 0;}
.usedin span{font-family:var(--mono); font-size:11.5px; color:var(--text-dim); background:var(--surface-2); border:1px solid var(--border-soft); padding:4px 10px; border-radius:6px;}

.loader{font-family:var(--mono); font-size:13px; color:var(--text-faint); padding:20px 0;}
.loader::after{content:"..."; animation:dots 1.5s steps(4, end) infinite;}
@keyframes dots{0%,20%{color:rgba(0,0,0,0);text-shadow:0.25em 0 0 rgba(0,0,0,0),.5em 0 0 rgba(0,0,0,0);} 40%{color:var(--amber);text-shadow:0.25em 0 0 rgba(0,0,0,0),.5em 0 0 rgba(0,0,0,0);} 60%{text-shadow:0.25em 0 0 var(--amber),.5em 0 0 rgba(0,0,0,0);} 80%,100%{text-shadow:0.25em 0 0 var(--amber),.5em 0 0 var(--amber);}}

@media(max-width:980px){
  .toc{display:none;}
  .container, .hero{padding-left:22px; padding-right:22px;}
}
</style>
</head>
<body>

<div class="wrap">
  <aside class="toc">
    <div class="toc-brand"><span class="dot"></span><span>wiki hub / index</span></div>
  </aside>

  <main>
    <div class="hero">
      <div class="eyebrow">knowledge hub · index</div>
      <h1>Wiki Index</h1>
    </div>

    <div class="container">
      <section class="topic" id="documents">
        <div class="topic-head"><h2>Доступные материалы</h2></div>
        
        <div class="grid2" id="wiki-grid">
            <div class="loader" id="loader">Загрузка файлов</div>
        </div>
      </section>
    </div>
  </main>
</div>

<script>
document.addEventListener('DOMContentLoaded', async function() {
  const grid = document.getElementById('wiki-grid');
  
  // === НАСТРОЙКИ ПУТЕЙ ===
  // Оставьте массив пустым или добавьте реальные пути к вашим html файлам
  const manualFiles = [enc3ll.github.io/wiki/attn.html, enc3ll.github.io/wiki/embd.html, enc3ll.github.io/wiki/MLP.html, enc3ll.github.io/wiki/pos.html, enc3ll.github.io/wiki/state.html, enc3ll.github.io/wiki/train.html, enc3ll.github.io/wiki/trformer.html]; 

  // =========================================================================
  // АЛЬТЕРНАТИВНЫЙ ВАРИАНТ: Если репозиторий публичный, можно использовать 
  // GitHub API для автоматического получения списка файлов в папке:
  // 
  // const REPO = "ваше_имя/название_репозитория";
  // const FOLDER = "папка_с_заметками";
  // const apiUrl = `https://api.github.com/repos/${REPO}/contents/${FOLDER}`;
  // =========================================================================

  let filesToLoad = manualFiles; 

  /*
  try {
    const ghResponse = await fetch(apiUrl);
    const ghData = await ghResponse.json();
    filesToLoad = ghData.filter(file => file.name.endsWith('.html')).map(file => file.download_url || file.path);
  } catch (err) {
    console.error("Ошибка получения файлов из GitHub API", err);
  }
  */

  grid.innerHTML = ''; // Убираем лоадер

  if (filesToLoad.length === 0) {
    grid.innerHTML = '<p style="color: var(--text-faint);">Файлы пока не добавлены. Укажите пути в массиве manualFiles или настройте GitHub API.</p>';
    return;
  }

  for (const url of filesToLoad) {
    try {
      const response = await fetch(url);
      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }
      
      const htmlText = await response.text();
      const parser = new DOMParser();
      const doc = parser.parseFromString(htmlText, 'text/html');
      
      let titleElement = doc.querySelector('h1');
      let title = titleElement ? titleElement.innerText.trim() : null;
      if (!title) {
        titleElement = doc.querySelector('title');
        title = titleElement ? titleElement.innerText.replace(' — полный разбор', '').trim() : url.split('/').pop();
      }

      let previewElement = doc.querySelector('.lede') || doc.querySelector('p');
      let previewText = previewElement ? previewElement.innerText.trim() : 'Описание отсутствует...';
      
      if (previewText.length > 160) {
        previewText = previewText.substring(0, 160) + '...';
      }

      const card = document.createElement('a');
      card.href = url;
      card.className = 'rec-card';
      card.innerHTML = `
        <h4>${title}</h4>
        <p>${previewText}</p>
        <div class="usedin" style="margin-top: 14px; margin-bottom: 0;">
          <span>${url.split('/').pop()}</span>
        </div>
      `;
      grid.appendChild(card);
      
    } catch (e) {
      console.warn(`Не удалось загрузить файл ${url}:`, e);
      // Убрана генерация фейковых 404 карточек. Ошибки будут просто логироваться в консоль.
    }
  }
});
</script>

</body>
</html>
